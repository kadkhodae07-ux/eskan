                          '        release {\n            signingConfig = signingConfigs.getByName("sanadyarRelease")',
                          1,
                      )
                  kts.write_text(text, encoding='utf-8')
          elif groovy.exists():
              text = groovy.read_text(encoding='utf-8')
              marker = '// SANADYAR_SIGNING_PATCH'
              if marker not in text:
                  prefix = '''// SANADYAR_SIGNING_PATCH
          def sanadyarKeystoreProperties = new Properties()
          def sanadyarKeystorePropertiesFile = rootProject.file('key.properties')
          sanadyarKeystoreProperties.load(new FileInputStream(sanadyarKeystorePropertiesFile))

          '''
