          groovy_flavors = "\n    // SANADYAR_DUAL_STORE_FLAVORS\n    flavorDimensions \"store\"\n    productFlavors {\n        bazaar { dimension \"store\"; resValue \"string\", \"app_name\", \"سندیار\" }\n        myket { dimension \"store\"; resValue \"string\", \"app_name\", \"سندیار\" }\n    }\n\n"
          if kts.exists():
              value = kts.read_text(encoding='utf-8')
              if marker not in value:
                  value = value.replace('    buildTypes {', kts_flavors + '    buildTypes {', 1)
                  value = value.replace('        release {', '        release {\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")', 1)
                  kts.write_text(value, encoding='utf-8')
          elif groovy.exists():
              value = groovy.read_text(encoding='utf-8')
              if marker not in value:
                  value = value.replace('    buildTypes {', groovy_flavors + '    buildTypes {', 1)
                  value = value.replace('        release {', "        release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'", 1)
                  groovy.write_text(value, encoding='utf-8')
          else:
              raise SystemExit('No Android app Gradle file found')
          PY

