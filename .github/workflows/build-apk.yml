      - name: Build isolated Bazaar and Myket release APKs
        run: |
          set -Eeuo pipefail
          set -o pipefail
          API_BASE="${SANADYAR_API_BASE_URL:-https://YOUR-DOMAIN.example/sanadyar}"
          PRO_PRODUCT_ID="${SANADYAR_PRO_PRODUCT_ID:-sanadyar_pro_monthly}"
          STORE_ROOT="$GITHUB_WORKSPACE/.ci/store-builds"
          rm -rf "$STORE_ROOT"
          mkdir -p "$STORE_ROOT" "$GITHUB_WORKSPACE/.ci/symbols/bazaar" "$GITHUB_WORKSPACE/.ci/symbols/myket"

          prepare_store_project() {
            local store="$1"
            local inactive_dependency="$2"
            local selected_adapter="$3"
            local inactive_adapter="$4"
            local destination="$STORE_ROOT/$store"

            mkdir -p "$destination"
            rsync -a --delete \
              --exclude='.dart_tool/' \
              --exclude='build/' \
              --exclude='pubspec.lock' \
              --exclude='android/.gradle/' \
              "$PROJECT_DIR/" "$destination/"

            STORE="$store" INACTIVE_DEPENDENCY="$inactive_dependency" PROJECT="$destination" python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ['PROJECT'])
          dependency = os.environ['INACTIVE_DEPENDENCY']
          pubspec = project / 'pubspec.yaml'
          lines = pubspec.read_text(encoding='utf-8').splitlines()
          filtered = [line for line in lines if not line.lstrip().startswith(f'{dependency}:')]
          if len(filtered) == len(lines):
              raise SystemExit(f'Inactive dependency {dependency} was not found in pubspec.yaml')
          pubspec.write_text('\n'.join(filtered) + '\n', encoding='utf-8')
          PY

            cp "$destination/lib/$selected_adapter" "$destination/lib/store_billing.dart"
            rm -f "$destination/lib/$inactive_adapter"

            (
              cd "$destination"
              flutter pub get 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/pub-get-$store.log"
              dart pub deps --json > "$GITHUB_WORKSPACE/.ci/reports/pub-deps-$store.json"
              flutter analyze --no-fatal-infos 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-analyze-$store.log"
            )
          }

          prepare_store_project bazaar myket_iap store_billing_bazaar.dart store_billing_myket.dart
          prepare_store_project myket flutter_poolakey store_billing_myket.dart store_billing_bazaar.dart

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = Path(os.environ['GITHUB_WORKSPACE']) / '.ci' / 'reports'
          expectations = {
              'bazaar': ('flutter_poolakey', 'myket_iap'),
              'myket': ('myket_iap', 'flutter_poolakey'),
          }
          lines = []
          for store, (required, forbidden) in expectations.items():
              data = json.loads((reports / f'pub-deps-{store}.json').read_text(encoding='utf-8'))
              names = {package['name'] for package in data.get('packages', [])}
              if required not in names:
                  raise SystemExit(f'{store}: required package {required} is missing')
              if forbidden in names:
                  raise SystemExit(f'{store}: inactive package {forbidden} remains in dependency graph')
              lines.append(f'{store}: required={required}; excluded={forbidden}; status=ok')
          (reports / 'isolated-billing-dependencies.log').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          BAZAAR_PROJECT_DIR="$STORE_ROOT/bazaar"
          MYKET_PROJECT_DIR="$STORE_ROOT/myket"
          echo "BAZAAR_PROJECT_DIR=$BAZAAR_PROJECT_DIR" >> "$GITHUB_ENV"
          echo "MYKET_PROJECT_DIR=$MYKET_PROJECT_DIR" >> "$GITHUB_ENV"

          build_store_release() {
            local store="$1"
            local project="$2"
            local bazaar_key="$3"
            local myket_key="$4"
            local log="$GITHUB_WORKSPACE/.ci/reports/build-${store}-apk.log"
            local missing="$project/build/app/outputs/mapping/${store}Release/missing_rules.txt"
            local retry_report="$GITHUB_WORKSPACE/.ci/reports/r8-retry-${store}.log"
            local -a command=(
              flutter build apk --flavor "$store" --release --no-pub
              --target-platform android-arm,android-arm64
              --tree-shake-icons --obfuscate
              --split-debug-info="$GITHUB_WORKSPACE/.ci/symbols/$store"
              --build-name "$APP_VERSION_NAME" --build-number "$APP_VERSION_CODE"
              --dart-define="SANADYAR_API_BASE_URL=$API_BASE"
              --dart-define="SANADYAR_STORE_CHANNEL=$store"
              --dart-define="SANADYAR_PRO_PRODUCT_ID=$PRO_PRODUCT_ID"
              --dart-define="SANADYAR_BAZAAR_RSA_KEY=$bazaar_key"
              --dart-define="SANADYAR_MYKET_RSA_KEY=$myket_key"
            )

            if (cd "$project" && "${command[@]}" 2>&1 | tee "$log"); then
              printf 'status=success_without_retry\n' > "$retry_report"
              return 0
            fi

            if [ ! -s "$missing" ]; then
              printf 'status=failed_no_missing_rules\nmissing_rules=%s\n' "$missing" > "$retry_report"
              return 1
            fi

            python3 "$project/tool/apply_r8_missing_rules.py" \
              "$missing" \
              "$project/android/app/proguard-rules.pro" \
              --report "$retry_report"
            python3 "$project/tool/verify_adivery_r8_rules.py" \
              "$project/android/app/proguard-rules.pro" \
              --report "$GITHUB_WORKSPACE/.ci/reports/adivery-r8-rules-${store}-retry.log"

            (cd "$project" && "${command[@]}" 2>&1 | tee -a "$log")
          }

          build_store_release \
            bazaar "$BAZAAR_PROJECT_DIR" \
            "${SANADYAR_BAZAAR_RSA_KEY:-}" ""
          build_store_release \
            myket "$MYKET_PROJECT_DIR" \
            "" "${SANADYAR_MYKET_RSA_KEY:-}"

