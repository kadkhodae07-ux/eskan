name: Sanadyar Build v1.0.16-build31
run-name: Sanadyar v1.0.16+31 | APK + diagnostics

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: Optional Flutter source ZIP path. Leave empty for automatic selection.
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: sanadyar-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WORKFLOW_VERSION: v1.0.16-build31-null-safety-analyze-hotfix
  FLUTTER_VERSION: 3.44.6
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_TARGET_SDK: '36'
  ANDROID_MIN_SDK: '24'
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_GRADLE_PLUGIN: 8.11.1
  GRADLE_VERSION: 8.14.3
  KOTLIN_VERSION: 2.2.20
  APP_PACKAGE: mk.kadkhodai.sanadyar
  APP_VERSION_NAME: 1.0.16
  APP_VERSION_CODE: '31'
  FILE_PICKER_VERSION: 10.3.10
  TESSERACT_OCR_VERSION: 0.5.0+sanadyar.1
  TESSERACT_OCR_PATH: packages/tesseract_ocr
  TESSERACT_ENGINE_VERSION: 4.8.0
  SOURCE_ZIP_INPUT: ${{ github.event.inputs.source_zip || '' }}

jobs:
  build-apk:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize clean workspace
        run: |
          set -Eeuo pipefail
          rm -rf "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/dist"
          mkdir -p \
            "$GITHUB_WORKSPACE/.ci/extracted" \
            "$GITHUB_WORKSPACE/.ci/reports" \
            "$GITHUB_WORKSPACE/dist/apk" \
            "$GITHUB_WORKSPACE/dist/logs"

          {
            echo "WORKFLOW_VERSION=$WORKFLOW_VERSION"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "COMMIT=$GITHUB_SHA"
          } | tee "$GITHUB_WORKSPACE/.ci/reports/workflow-info.log"

      - name: Select latest valid Flutter source ZIP
        id: source
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"

          selected_zip=''
          project_dir=''

          validate_zip() {
            local zip_path="$1"
            unzip -tq "$zip_path" >/dev/null 2>&1 || return 1
            unzip -Z1 "$zip_path" | grep -Eq '(^|/)pubspec\.yaml$' || return 1
            unzip -Z1 "$zip_path" | grep -Eq '(^|/)lib/main\.dart$' || return 1
          }

          extract_and_locate() {
            local zip_path="$1"
            rm -rf "$GITHUB_WORKSPACE/.ci/extracted"
            mkdir -p "$GITHUB_WORKSPACE/.ci/extracted"
            unzip -q "$zip_path" -d "$GITHUB_WORKSPACE/.ci/extracted"

            find "$GITHUB_WORKSPACE/.ci/extracted" \
              -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -printf '%h\n' \
              | while IFS= read -r candidate; do
                  if [ -f "$candidate/lib/main.dart" ]; then
                    printf '%s\n' "$candidate"
                  fi
                done \
              | sort \
              | head -n 1
          }

          list_source_candidates() {
            python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          excluded = (
              'apk', 'log', 'complete', 'diagnostic', 'artifact',
              'output', 'failure', 'sha256', 'checksum',
          )
          rows = []

          for path in root.glob('*.zip'):
              lower = path.name.lower()
              if any(token in lower for token in excluded):
                  continue

              try:
                  rel = path.relative_to(root).as_posix()
                  raw = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%ct', '--', rel],
                      text=True,
                  ).strip()
                  commit_time = int(raw or 0)
              except Exception:
                  commit_time = 0

              build_numbers = [
                  int(value)
                  for value in re.findall(r'(?:build|\+|_)(\d+)', lower)
              ]
              build_number = max(build_numbers, default=0)
              rows.append((build_number, commit_time, path.stat().st_mtime_ns, str(path)))

          for _, _, _, path in sorted(rows, reverse=True):
              print(path)
          PY
          }

          if [ -n "$SOURCE_ZIP_INPUT" ]; then
            requested="$GITHUB_WORKSPACE/$SOURCE_ZIP_INPUT"
            if [ ! -f "$requested" ]; then
              echo "Requested ZIP does not exist: $SOURCE_ZIP_INPUT" >&2
              exit 1
            fi
            if ! validate_zip "$requested"; then
              echo "Requested ZIP is not a valid Flutter source archive: $SOURCE_ZIP_INPUT" >&2
              exit 1
            fi
            selected_zip="$requested"
            project_dir="$(extract_and_locate "$selected_zip")"
          else
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if validate_zip "$candidate"; then
                selected_zip="$candidate"
                project_dir="$(extract_and_locate "$selected_zip")"
                [ -n "$project_dir" ] && break
              fi
            done < <(list_source_candidates)

            if [ -z "$project_dir" ] \
              && [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ] \
              && [ -f "$GITHUB_WORKSPACE/lib/main.dart" ]; then
              project_dir="$GITHUB_WORKSPACE"
            fi
          fi

          if [ -z "$project_dir" ] \
            || [ ! -f "$project_dir/pubspec.yaml" ] \
            || [ ! -f "$project_dir/lib/main.dart" ]; then
            echo 'No valid Flutter project was found.' >&2
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "selected_zip=$selected_zip" >> "$GITHUB_OUTPUT"

          {
            echo "Selected ZIP: ${selected_zip:-repository root}"
            echo "Project directory: $project_dir"
          } | tee "$GITHUB_WORKSPACE/.ci/reports/source-selection.log"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Record tool versions
        run: |
          set -Eeuo pipefail
          flutter --version | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-version.log"
          dart --version 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/dart-version.log"
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/java-version.log"
          flutter doctor -v 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-doctor.log"

      - name: Install Android SDK 36
        run: |
          set -Eeuo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo 'ANDROID_SDK_ROOT and ANDROID_HOME are empty.' >&2
            exit 1
          fi

          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "sdkmanager was not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi

          set +e
          set +o pipefail
          yes | "$sdkmanager" --licenses > "$GITHUB_WORKSPACE/.ci/reports/android-licenses.log" 2>&1
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          set -e

          if [ "$license_status" -ne 0 ]; then
            tail -n 100 "$GITHUB_WORKSPACE/.ci/reports/android-licenses.log" >&2 || true
            exit "$license_status"
          fi

          "$sdkmanager" \
            'platform-tools' \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/android-sdk-install.log"

          test -d "$sdk_root/platforms/android-$ANDROID_COMPILE_SDK"
          test -d "$sdk_root/build-tools/$ANDROID_BUILD_TOOLS"

      - name: Ensure Android project exists
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ] \
            || { [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; }; then
            flutter create \
              --platforms=android \
              --org mk.kadkhodai \
              --project-name sanadyar \
              . 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-create-android.log"
          else
            echo 'Existing Android project preserved; generated state will be cleaned separately.' \
              | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-create-android.log"
          fi

          test -f android/gradlew
          chmod +x android/gradlew

      - name: Normalize Android Gradle, Kotlin and app configuration
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          agp = os.environ['ANDROID_GRADLE_PLUGIN']
          gradle_version = os.environ['GRADLE_VERSION']
          kotlin = os.environ['KOTLIN_VERSION']
          package = os.environ['APP_PACKAGE']
          compile_sdk = os.environ['ANDROID_COMPILE_SDK']
          target_sdk = os.environ['ANDROID_TARGET_SDK']
          min_sdk = os.environ['ANDROID_MIN_SDK']

          settings = next(
              (p for p in (Path('android/settings.gradle.kts'), Path('android/settings.gradle')) if p.exists()),
              None,
          )
          if settings is None:
              raise SystemExit('Android settings.gradle(.kts) was not generated')

          text = settings.read_text(encoding='utf-8')
          if settings.suffix == '.kts':
              text, agp_count = re.subn(
                  r'id\("com\.android\.application"\)\s+version\s+"[^"]+"\s+apply\s+false',
                  f'id("com.android.application") version "{agp}" apply false',
                  text,
                  count=1,
              )
              text, kotlin_count = re.subn(
                  r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
                  f'id("org.jetbrains.kotlin.android") version "{kotlin}" apply false',
                  text,
                  count=1,
              )
              if kotlin_count == 0:
                  marker = f'id("com.android.application") version "{agp}" apply false'
                  text = text.replace(
                      marker,
                      marker + f'\n    id("org.jetbrains.kotlin.android") version "{kotlin}" apply false',
                      1,
                  )
              if agp_count != 1:
                  raise SystemExit('Unable to pin Android Gradle Plugin in settings.gradle.kts')
          else:
              text, agp_count = re.subn(
                  r"id ['\"]com\.android\.application['\"] version ['\"][^'\"]+['\"] apply false",
                  f'id "com.android.application" version "{agp}" apply false',
                  text,
                  count=1,
              )
              text, kotlin_count = re.subn(
                  r"id ['\"]org\.jetbrains\.kotlin\.android['\"] version ['\"][^'\"]+['\"] apply false",
                  f'id "org.jetbrains.kotlin.android" version "{kotlin}" apply false',
                  text,
                  count=1,
              )
              if kotlin_count == 0:
                  marker = f'id "com.android.application" version "{agp}" apply false'
                  text = text.replace(
                      marker,
                      marker + f'\n    id "org.jetbrains.kotlin.android" version "{kotlin}" apply false',
                      1,
                  )
              if agp_count != 1:
                  raise SystemExit('Unable to pin Android Gradle Plugin in settings.gradle')
          settings.write_text(text, encoding='utf-8')

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper_text = wrapper.read_text(encoding='utf-8')
          wrapper_text, wrapper_count = re.subn(
              r'distributionUrl=.*gradle-[^-\s]+-(?:all|bin)\.zip',
              f'distributionUrl=https\\://services.gradle.org/distributions/gradle-{gradle_version}-all.zip',
              wrapper_text,
              count=1,
          )
          if wrapper_count != 1:
              raise SystemExit('Unable to pin Gradle wrapper version')
          wrapper.write_text(wrapper_text, encoding='utf-8')

          app_gradle = next(
              (p for p in (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')) if p.exists()),
              None,
          )
          if app_gradle is None:
              raise SystemExit('Android app Gradle file was not generated')

          app = app_gradle.read_text(encoding='utf-8')
          if app_gradle.suffix == '.kts':
              if 'id("org.jetbrains.kotlin.android")' not in app:
                  app = app.replace(
                      'id("com.android.application")',
                      'id("com.android.application")\n    id("org.jetbrains.kotlin.android")',
                      1,
                  )
              app = re.sub(r'namespace\s*=\s*"[^"]+"', f'namespace = "{package}"', app)
              app = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package}"', app)
              app, c1 = re.subn(r'(?m)^(\s*)compileSdk\s*=\s*[^\n]+$', rf'\1compileSdk = {compile_sdk}', app, count=1)
              app, c2 = re.subn(r'(?m)^(\s*)minSdk\s*=\s*[^\n]+$', rf'\1minSdk = {min_sdk}', app, count=1)
              app, c3 = re.subn(r'(?m)^(\s*)targetSdk\s*=\s*[^\n]+$', rf'\1targetSdk = {target_sdk}', app, count=1)
          else:
              if "id 'org.jetbrains.kotlin.android'" not in app and 'id "org.jetbrains.kotlin.android"' not in app:
                  app = app.replace(
                      "id 'com.android.application'",
                      "id 'com.android.application'\n    id 'org.jetbrains.kotlin.android'",
                      1,
                  )
              app = re.sub(r'namespace\s+["\'][^"\']+["\']', f'namespace "{package}"', app)
              app = re.sub(r'applicationId\s+["\'][^"\']+["\']', f'applicationId "{package}"', app)
              app, c1 = re.subn(r'(?m)^(\s*)compileSdk(?:Version)?\s+[^\n]+$', rf'\1compileSdkVersion {compile_sdk}', app, count=1)
              app, c2 = re.subn(r'(?m)^(\s*)minSdk(?:Version)?\s+[^\n]+$', rf'\1minSdkVersion {min_sdk}', app, count=1)
              app, c3 = re.subn(r'(?m)^(\s*)targetSdk(?:Version)?\s+[^\n]+$', rf'\1targetSdkVersion {target_sdk}', app, count=1)

          if (c1, c2, c3) != (1, 1, 1):
              raise SystemExit(f'Unable to normalize SDK levels: compile={c1}, min={c2}, target={c3}')
          app_gradle.write_text(app, encoding='utf-8')

          gradle_properties = Path('android/gradle.properties')
          props = gradle_properties.read_text(encoding='utf-8') if gradle_properties.exists() else ''
          required = {
              'org.gradle.jvmargs': '-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError',
              'android.useAndroidX': 'true',
              'android.enableJetifier': 'true',
              'kotlin.jvm.target.validation.mode': 'error',
              'org.gradle.java.installations.auto-detect': 'true',
              'org.gradle.java.installations.auto-download': 'false',
          }
          lines = [line for line in props.splitlines() if line.strip()]
          existing = {line.split('=', 1)[0].strip() for line in lines if '=' in line}
          for key, value in required.items():
              if key not in existing:
                  lines.append(f'{key}={value}')
          gradle_properties.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # local_auth requires a FragmentActivity on Android.
          java_root = Path('android/app/src/main/java')
          kotlin_root = Path('android/app/src/main/kotlin')
          for generated in list(java_root.rglob('MainActivity.java')) + list(kotlin_root.rglob('MainActivity.kt')):
              generated.unlink()

          main_activity = kotlin_root / Path(package.replace('.', '/')) / 'MainActivity.kt'
          main_activity.parent.mkdir(parents=True, exist_ok=True)
          main_activity.write_text(
              f'''package {package}\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity : FlutterFragmentActivity()\n''',
              encoding='utf-8',
          )

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text(encoding='utf-8')
          manifest_text = re.sub(r'\s+package="[^"]+"', '', manifest_text)
          permission_lines = [
              ('android.permission.CAMERA', '<uses-permission android:name="android.permission.CAMERA" />'),
              ('android.permission.USE_BIOMETRIC', '<uses-permission android:name="android.permission.USE_BIOMETRIC" />'),
              ('android.permission.USE_FINGERPRINT', '<uses-permission android:name="android.permission.USE_FINGERPRINT" android:maxSdkVersion="27" />'),
          ]
          manifest_open = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          additions = [line for name, line in permission_lines if name not in manifest_text]
          if additions:
              manifest_text = manifest_text.replace(
                  manifest_open,
                  manifest_open + '\n    ' + '\n    '.join(additions),
                  1,
              )
          manifest.write_text(manifest_text, encoding='utf-8')

          print(f'Pinned AGP: {agp}')
          print(f'Pinned Gradle: {gradle_version}')
          print(f'Pinned Kotlin: {kotlin}')
          print(f'Package: {package}')
          print(f'SDK levels: min={min_sdk}, target={target_sdk}, compile={compile_sdk}')
          PY

          {
            echo '--- settings.gradle plugin versions ---'
            grep -nE 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle* || true
            echo '--- Gradle wrapper ---'
            grep -n 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties
            echo '--- Android app SDK and identity ---'
            grep -nE 'namespace|applicationId|compileSdk|targetSdk|minSdk' android/app/build.gradle* || true
            echo '--- MainActivity ---'
            find android/app/src/main -name 'MainActivity.*' -print -exec sed -n '1,40p' {} \;
          } | tee "$GITHUB_WORKSPACE/.ci/reports/android-toolchain.log"

      - name: Clean stale Flutter and plugin state
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          flutter clean 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-clean.log"
          rm -rf \
            .dart_tool \
            build \
            android/.gradle \
            pubspec.lock \
            .flutter-plugins \
            .flutter-plugins-dependencies

          find android/app/src/main -type f -name GeneratedPluginRegistrant.java -delete || true
          find android/app/src/main -type f -name GeneratedPluginRegistrant.kt -delete || true

          echo 'Removed stale dependency, Gradle and generated-plugin state.' \
            | tee "$GITHUB_WORKSPACE/.ci/reports/cache-cleanup.log"

      - name: Resolve pinned dependencies
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          flutter pub get 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/pub-get.log"
          cp pubspec.lock "$GITHUB_WORKSPACE/.ci/reports/pubspec.lock"
          dart pub deps --json > "$GITHUB_WORKSPACE/.ci/reports/pub-deps.json"

      - name: Enforce JVM 17 for generated app module
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          test -x tool/enforce_android_jvm17.py
          python3 tool/enforce_android_jvm17.py \
            --project "$PROJECT_DIR" \
            --agp "$ANDROID_GRADLE_PLUGIN" \
            --kotlin "$KOTLIN_VERSION" \
            --compile-sdk "$ANDROID_COMPILE_SDK" \
            --report "$GITHUB_WORKSPACE/.ci/reports/android-jvm17-patch.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/android-jvm17-patch.log"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ['GITHUB_WORKSPACE']) / '.ci/reports/android-jvm17-patch.json'
          data = json.loads(report.read_text(encoding='utf-8'))
          if data.get('javaTarget') != 17 or data.get('kotlinTarget') != 17:
              raise SystemExit('JVM 17 report contains incorrect target values')
          if data.get('strategy') != 'generated-app-only-local-ocr-preconfigured':
              raise SystemExit('Unexpected JVM patch strategy')
          if data.get('androidGradlePlugin') != os.environ['ANDROID_GRADLE_PLUGIN']:
              raise SystemExit('Android Gradle Plugin report version mismatch')
          if data.get('kotlinPlugin') != os.environ['KOTLIN_VERSION']:
              raise SystemExit('Kotlin plugin report version mismatch')
          if data.get('compileSdk') != os.environ['ANDROID_COMPILE_SDK']:
              raise SystemExit('compileSdk report version mismatch')
          if not data.get('applicationPatched'):
              raise SystemExit('Android application module was not normalized for JVM 17')
          if data.get('packageSourcesPatched') is not False:
              raise SystemExit('Workflow must not patch dependency or Pub Cache source files')
          if not data.get('rootBuildFileSafe'):
              raise SystemExit('Android root build file safety check failed')

          patched = data.get('patchedModules', [])
          packages = {item.get('package') for item in patched}
          if packages != {'application'}:
              raise SystemExit(f'Unexpected patched package set: {sorted(packages)}')

          print('Generated Android app module normalized for JVM 17.')
          print('Dependency package sources patched: false')
          PY

          root_gradle_files=()
          for candidate in android/build.gradle android/build.gradle.kts; do
            [ -f "$candidate" ] && root_gradle_files+=("$candidate")
          done
          if [ "${#root_gradle_files[@]}" -eq 0 ]; then
            echo 'Android root Gradle file was not found.' >&2
            exit 1
          fi
          if grep -HnE 'SANADYAR_JVM17_PATCH|SANADYAR_JVM17_TARGETED_PATCH|SANADYAR_APP_JVM17_PATCH' \
            "${root_gradle_files[@]}" \
            | tee "$GITHUB_WORKSPACE/.ci/reports/root-gradle-marker-check.log"; then
            echo 'A generated JVM module patch remains in the Android root Gradle file.' >&2
            exit 1
          fi
          : > "$GITHUB_WORKSPACE/.ci/reports/root-gradle-marker-check.log"

      - name: Verify pinned plugins, local OCR source and assets
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if grep -RIn --include='*.dart' 'FilePicker\.pickFiles' lib test 2>/dev/null; then
            echo 'Static FilePicker.pickFiles API belongs to file_picker 11 and must not remain in build31.' >&2
            exit 1
          fi

          if ! grep -RIn --include='*.dart' 'FilePicker\.platform\.pickFiles' lib test 2>/dev/null \
            | tee "$GITHUB_WORKSPACE/.ci/reports/file-picker-api.log"; then
            echo 'Expected FilePicker.platform.pickFiles API was not found.' >&2
            exit 1
          fi

          test -d "$TESSERACT_OCR_PATH"
          test -x tool/verify_vendored_ocr.py
          python3 tool/verify_vendored_ocr.py \
            --project "$PROJECT_DIR" \
            --compile-sdk "$ANDROID_COMPILE_SDK" \
            --min-sdk "$ANDROID_MIN_SDK" \
            --engine-version "$TESSERACT_ENGINE_VERSION" \
            --report "$GITHUB_WORKSPACE/.ci/reports/vendored-ocr-validation.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/vendored-ocr-validation.log"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ['GITHUB_WORKSPACE']) / '.ci/reports/pub-deps.json'
          data = json.loads(report.read_text(encoding='utf-8'))
          packages = {item['name']: item['version'] for item in data.get('packages', [])}

          actual = packages.get('file_picker')
          expected = os.environ['FILE_PICKER_VERSION']
          print(f'file_picker resolved version: {actual}')
          if actual != expected:
              raise SystemExit(f'Expected file_picker {expected}, but resolved {actual!r}')

          actual_ocr = packages.get('tesseract_ocr')
          expected_ocr = os.environ['TESSERACT_OCR_VERSION']
          print(f'local tesseract_ocr resolved version: {actual_ocr}')
          if actual_ocr != expected_ocr:
              raise SystemExit(f'Expected local tesseract_ocr {expected_ocr}, but resolved {actual_ocr!r}')
          PY

          if find "$TESSERACT_OCR_PATH/android/src/main" -type f -name '*.kt' -print -quit | grep -q .; then
            echo 'Kotlin source unexpectedly exists in the vendored OCR plugin.' >&2
            exit 1
          fi

          test -s assets/tessdata/fas.traineddata
          test -s assets/tessdata/eng.traineddata
          test -s assets/tessdata_config.json
          grep -q 'fas.traineddata' assets/tessdata_config.json
          grep -q 'eng.traineddata' assets/tessdata_config.json
          du -h assets/tessdata/* | tee "$GITHUB_WORKSPACE/.ci/reports/ocr-assets.log"

      - name: Resolve and preflight OCR engine and plugin compilation
        run: |
          set -Eeuo pipefail
          set -o pipefail
          cd "$PROJECT_DIR"

          chmod +x android/gradlew
          ./android/gradlew -p android :tesseract_ocr:tasks --all --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/tesseract-gradle-tasks.log"

          kotlin_task_registered=false
          if grep -Eq '^compileDebugKotlin([[:space:]]|$)' \
            "$GITHUB_WORKSPACE/.ci/reports/tesseract-gradle-tasks.log"; then
            kotlin_task_registered=true
          fi

          {
            echo 'Source-level Kotlin validation: PASS (no .kt files in vendored OCR android/src/main).'
            echo "Gradle compileDebugKotlin task registered: $kotlin_task_registered"
            echo 'Task registration is informational and is not evidence of Kotlin source compilation.'
          } | tee "$GITHUB_WORKSPACE/.ci/reports/tesseract-kotlin-absence.log"

          if [ "$kotlin_task_registered" = true ]; then
            ./android/gradlew -p android :tesseract_ocr:compileDebugKotlin --stacktrace --no-daemon \
              2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/tesseract-kotlin-preflight.log"

            if ! grep -Eq '^> Task :tesseract_ocr:compileDebugKotlin (NO-SOURCE|SKIPPED)$' \
              "$GITHUB_WORKSPACE/.ci/reports/tesseract-kotlin-preflight.log"; then
              echo 'The registered OCR Kotlin task was not NO-SOURCE or SKIPPED.' >&2
              exit 1
            fi
          else
            echo 'compileDebugKotlin is not registered for the OCR module.' \
              | tee "$GITHUB_WORKSPACE/.ci/reports/tesseract-kotlin-preflight.log"
          fi

          ./android/gradlew -p android \
            :tesseract_ocr:dependencies \
            --configuration debugCompileClasspath \
            --refresh-dependencies \
            --stacktrace \
            --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/tesseract-engine-dependencies.log"

          expected_engine="cz.adaptech.tesseract4android:tesseract4android:$TESSERACT_ENGINE_VERSION"
          if grep -Eq 'tesseract4android[^[:space:]]*:[^[:space:]]+ FAILED|Could not find cz\.adaptech\.tesseract4android' \
            "$GITHUB_WORKSPACE/.ci/reports/tesseract-engine-dependencies.log"; then
            echo 'Tesseract4Android dependency resolution failed.' >&2
            exit 1
          fi
          if ! grep -Fq "$expected_engine" "$GITHUB_WORKSPACE/.ci/reports/tesseract-engine-dependencies.log"; then
            echo "Pinned OCR engine was not present in debugCompileClasspath: $expected_engine" >&2
            exit 1
          fi

          if ! grep -Eq '^compileDebugJavaWithJavac([[:space:]]|$)' "$GITHUB_WORKSPACE/.ci/reports/tesseract-gradle-tasks.log"; then
            echo 'OCR Java compilation task was not found.' >&2
            exit 1
          fi

          ./android/gradlew -p android :tesseract_ocr:compileDebugJavaWithJavac --stacktrace --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/tesseract-java-preflight.log"

          engine_cache="$HOME/.gradle/caches/modules-2/files-2.1/cz.adaptech.tesseract4android/tesseract4android/$TESSERACT_ENGINE_VERSION"
          mapfile -t engine_aars < <(find "$engine_cache" -type f -name '*.aar' -print 2>/dev/null | sort)
          if [ "${#engine_aars[@]}" -ne 1 ]; then
            printf 'Expected exactly one cached Tesseract4Android AAR, found %s under %s\n' \
              "${#engine_aars[@]}" "$engine_cache" >&2
            printf '%s\n' "${engine_aars[@]:-}" >&2
            exit 1
          fi

          engine_aar="${engine_aars[0]}"
          sha256sum "$engine_aar" | tee "$GITHUB_WORKSPACE/.ci/reports/tesseract-engine-aar.sha256"
          unzip -tq "$engine_aar" | tee "$GITHUB_WORKSPACE/.ci/reports/tesseract-engine-aar-integrity.log"
          python3 - "$engine_aar" "$GITHUB_WORKSPACE/.ci/reports/tesseract-engine-aar.json" "$TESSERACT_ENGINE_VERSION" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          aar = Path(sys.argv[1]).resolve()
          report_path = Path(sys.argv[2])
          with zipfile.ZipFile(aar) as archive:
              names = archive.namelist()
          required = {'AndroidManifest.xml', 'classes.jar'}
          missing = sorted(required.difference(names))
          jni = sorted(name for name in names if name.startswith('jni/') and name.endswith('.so'))
          if missing:
              raise SystemExit(f'Missing required AAR entries: {missing}')
          if not jni:
              raise SystemExit('Tesseract4Android AAR contains no JNI libraries')
          digest = hashlib.sha256(aar.read_bytes()).hexdigest()
          report = {
              'coordinate': 'cz.adaptech.tesseract4android:tesseract4android:' + sys.argv[3],
              'file': str(aar),
              'sizeBytes': aar.stat().st_size,
              'sha256': digest,
              'jniLibraries': jni,
              'requiredEntriesPresent': True,
          }
          report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

          if grep -RInE 'VERSION_(1_8|11)|jvmTarget[^0-9]*(1\.8|8|11)([^0-9]|$)' \
            android/app "$TESSERACT_OCR_PATH/android" 2>/dev/null \
            | tee "$GITHUB_WORKSPACE/.ci/reports/forbidden-jvm-targets.log"; then
            echo 'Legacy JVM targets remain in the application or vendored OCR Android project.' >&2
            exit 1
          fi

      - name: Apply app version
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          desired = f"{os.environ['APP_VERSION_NAME']}+{os.environ['APP_VERSION_CODE']}"
          text, count = re.subn(
              r'(?m)^version:\s*[^\n]+$',
              f'version: {desired}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Unable to update pubspec version')
          pubspec.write_text(text, encoding='utf-8')
          print(f'Applied app version: {desired}')
          PY

      - name: Configure signing mode
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          secret_count=0
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && secret_count=$((secret_count + 1))
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && secret_count=$((secret_count + 1))
          [ -n "${ANDROID_KEY_ALIAS:-}" ] && secret_count=$((secret_count + 1))
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] && secret_count=$((secret_count + 1))

          if [ "$secret_count" -ne 0 ] && [ "$secret_count" -ne 4 ]; then
            echo 'Signing secrets are incomplete. All four values are required.' >&2
            exit 1
          fi

          if [ "$secret_count" -eq 4 ]; then
            mkdir -p android/app
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo 'SIGNING_MODE=release' >> "$GITHUB_ENV"
            echo 'Release signing configured from GitHub Secrets.' \
              | tee "$GITHUB_WORKSPACE/.ci/reports/signing.log"
          elif [ -f android/key.properties ]; then
            echo 'SIGNING_MODE=release' >> "$GITHUB_ENV"
            echo 'Packaged key.properties detected; existing signing configuration will be used.' \
              | tee "$GITHUB_WORKSPACE/.ci/reports/signing.log"
          else
            echo 'SIGNING_MODE=debug' >> "$GITHUB_ENV"
            echo 'No signing configuration found; a debug APK will be built.' \
              | tee "$GITHUB_WORKSPACE/.ci/reports/signing.log"
          fi

      - name: Apply release signing configuration
        if: env.SIGNING_MODE == 'release'
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')

          if kts.exists():
              text = kts.read_text(encoding='utf-8')
              marker = '// SANADYAR_SIGNING_PATCH'
              if marker not in text:
                  prefix = '''// SANADYAR_SIGNING_PATCH
          import java.io.FileInputStream
          import java.util.Properties

          val sanadyarKeystoreProperties = Properties()
          val sanadyarKeystorePropertiesFile = rootProject.file("key.properties")
          sanadyarKeystoreProperties.load(FileInputStream(sanadyarKeystorePropertiesFile))

          '''
                  text = prefix + text
                  signing = '''
              signingConfigs {
                  create("sanadyarRelease") {
                      keyAlias = sanadyarKeystoreProperties["keyAlias"] as String
                      keyPassword = sanadyarKeystoreProperties["keyPassword"] as String
                      storeFile = file(sanadyarKeystoreProperties["storeFile"] as String)
                      storePassword = sanadyarKeystoreProperties["storePassword"] as String
                  }
              }

          '''
                  text = text.replace('    buildTypes {', signing + '    buildTypes {', 1)
                  if 'signingConfig = signingConfigs.getByName("debug")' in text:
                      text = text.replace(
                          'signingConfig = signingConfigs.getByName("debug")',
                          'signingConfig = signingConfigs.getByName("sanadyarRelease")',
                          1,
                      )
                  else:
                      text = text.replace(
                          '        release {',
                          '        release {\n            signingConfig = signingConfigs.getByName("sanadyarRelease")',
                          1,
                      )
                  kts.write_text(text, encoding='utf-8')
          elif groovy.exists():
              text = groovy.read_text(encoding='utf-8')
              marker = '// SANADYAR_SIGNING_PATCH'
              if marker not in text:
                  prefix = '''// SANADYAR_SIGNING_PATCH
          def sanadyarKeystoreProperties = new Properties()
          def sanadyarKeystorePropertiesFile = rootProject.file('key.properties')
          sanadyarKeystoreProperties.load(new FileInputStream(sanadyarKeystorePropertiesFile))

          '''
                  text = prefix + text
                  signing = '''
              signingConfigs {
                  sanadyarRelease {
                      keyAlias sanadyarKeystoreProperties['keyAlias']
                      keyPassword sanadyarKeystoreProperties['keyPassword']
                      storeFile file(sanadyarKeystoreProperties['storeFile'])
                      storePassword sanadyarKeystoreProperties['storePassword']
                  }
              }

          '''
                  text = text.replace('    buildTypes {', signing + '    buildTypes {', 1)
                  if 'signingConfig signingConfigs.debug' in text:
                      text = text.replace(
                          'signingConfig signingConfigs.debug',
                          'signingConfig signingConfigs.sanadyarRelease',
                          1,
                      )
                  else:
                      text = text.replace(
                          '        release {',
                          '        release {\n            signingConfig signingConfigs.sanadyarRelease',
                          1,
                      )
                  groovy.write_text(text, encoding='utf-8')
          else:
              raise SystemExit('No Android app Gradle file found')
          PY

      - name: Verify Build 31 analyzer hotfix
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          main = Path('lib/main.dart').read_text(encoding='utf-8')
          required = [
              'final decoded = im.decodeImage(bytes);',
              "if (decoded == null) throw const FormatException('تصویر قابل پردازش نیست.');",
              'var source = im.bakeOrientation(decoded);',
              'stampColor.toARGB32() == value.toARGB32()',
              'color.toARGB32() == value.toARGB32()',
              'inkColor.toARGB32() == value.toARGB32()',
          ]
          missing = [item for item in required if item not in main]
          if missing:
              raise SystemExit(f'Build 31 analyzer hotfix markers are missing: {missing}')

          forbidden = [
              'stampColor.value == value.value',
              'color.value == value.value',
              'inkColor.value == value.value',
          ]
          present = [item for item in forbidden if item in main]
          if present:
              raise SystemExit(f'Deprecated Color.value comparisons remain: {present}')

          ocr = Path('packages/tesseract_ocr/lib/tesseract_ocr.dart').read_text(encoding='utf-8')
          if "import 'dart:typed_data';" in ocr:
              raise SystemExit('Redundant dart:typed_data import remains in OCR wrapper')

          print('Build 31 analyzer hotfix source markers verified.')
          PY

      - name: Analyze Flutter source
        run: |
          set -Eeuo pipefail
          set -o pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-analyze.log"

      - name: Run Flutter tests
        run: |
          set -Eeuo pipefail
          set -o pipefail
          cd "$PROJECT_DIR"
          flutter test 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-test.log"

      - name: Build APK
        run: |
          set -Eeuo pipefail
          set -o pipefail
          cd "$PROJECT_DIR"

          if [ "${SIGNING_MODE:-debug}" = 'release' ]; then
            flutter build apk --release \
              --build-name "$APP_VERSION_NAME" \
              --build-number "$APP_VERSION_CODE" \
              2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/build-apk.log"
          else
            flutter build apk --debug \
              --build-name "$APP_VERSION_NAME" \
              --build-number "$APP_VERSION_CODE" \
              2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/build-apk.log"
          fi

      - name: Collect APK and diagnostics
        if: always()
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist/apk" "$GITHUB_WORKSPACE/dist/logs"
          cp -R "$GITHUB_WORKSPACE/.ci/reports/." "$GITHUB_WORKSPACE/dist/logs/" 2>/dev/null || true

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR/build/app/outputs/flutter-apk" ]; then
            find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
              -maxdepth 1 -type f -name '*.apk' -print0 \
              | while IFS= read -r -d '' apk; do
                  base="$(basename "$apk")"
                  if [[ "$base" == *release* ]]; then
                    output="sanadyar-v${APP_VERSION_NAME}-build${APP_VERSION_CODE}-release.apk"
                  else
                    output="sanadyar-v${APP_VERSION_NAME}-build${APP_VERSION_CODE}-debug.apk"
                  fi
                  cp "$apk" "$GITHUB_WORKSPACE/dist/apk/$output"
                done
          fi

          apk_count="$(find "$GITHUB_WORKSPACE/dist/apk" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          {
            echo "Workflow: $WORKFLOW_VERSION"
            echo "Version: $APP_VERSION_NAME+$APP_VERSION_CODE"
            echo "Signing mode: ${SIGNING_MODE:-not-configured}"
            echo "APK count: $apk_count"
            echo "Job status at collection: ${{ job.status }}"
          } | tee "$GITHUB_WORKSPACE/dist/logs/final-summary.log"

          if [ "${{ job.status }}" = 'success' ] && [ "$apk_count" -ne 1 ]; then
            echo 'Build was reported successful but exactly one APK was not found.' >&2
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: sanadyar-v1.0.16-build31-apk
          path: dist/apk/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanadyar-v1.0.16-build31-logs
          path: dist/logs/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
