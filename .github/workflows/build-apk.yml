          python3 - <<'PY'
          from pathlib import Path
          import re

          root = next((p for p in (Path('android/build.gradle.kts'), Path('android/build.gradle')) if p.exists()), None)
          app = next((p for p in (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')) if p.exists()), None)
          if root is None or app is None:
              raise SystemExit('Android Gradle files are missing')

          root_text = root.read_text(encoding='utf-8')
          repos = ('https://jitpack.io', 'https://maven.myket.ir')
          if root.suffix == '.kts':
              anchor = 'mavenCentral()'
              additions = ''.join(f'\n        maven {{ url = uri("{url}") }}' for url in repos if url not in root_text)
          else:
              anchor = 'mavenCentral()'
              additions = ''.join(f"\n        maven {{ url '{url}' }}" for url in repos if url not in root_text)
          if additions:
              if anchor not in root_text:
                  raise SystemExit('Unable to locate repository anchor in Android root Gradle file')
              root_text = root_text.replace(anchor, anchor + additions, 1)
          root.write_text(root_text, encoding='utf-8')

          app_text = app.read_text(encoding='utf-8')
          if app.suffix == '.kts':
              placeholders = '''
                manifestPlaceholders["marketApplicationId"] = "ir.mservices.market"
                manifestPlaceholders["marketBindAddress"] = "ir.mservices.market.InAppBillingService.BIND"
                manifestPlaceholders["marketPermission"] = "ir.mservices.market.BILLING"'''
              if 'marketApplicationId' not in app_text:
                  app_text, count = re.subn(
                      r'(?m)^(\s*targetSdk\s*=\s*[^\n]+)$',
                      r'\1' + placeholders,
                      app_text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit('Unable to add Myket manifest placeholders to build.gradle.kts')
          else:
              placeholders = '''
                manifestPlaceholders += [
                    marketApplicationId: "ir.mservices.market",
                    marketBindAddress: "ir.mservices.market.InAppBillingService.BIND",
                    marketPermission: "ir.mservices.market.BILLING"
                ]'''
              if 'marketApplicationId' not in app_text:
                  app_text, count = re.subn(
                      r'(?m)^(\s*targetSdk(?:Version)?\s+[^\n]+)$',
                      r'\1' + placeholders,
                      app_text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit('Unable to add Myket manifest placeholders to build.gradle')
          app.write_text(app_text, encoding='utf-8')

          print('JitPack repository configured for Poolakey.')
          print('Myket Maven repository and manifest placeholders configured.')
