                      keyAlias sanadyarKeystoreProperties['keyAlias']
                      keyPassword sanadyarKeystoreProperties['keyPassword']
                      storeFile file(sanadyarKeystoreProperties['storeFile'])
                      storePassword sanadyarKeystoreProperties['storePassword']
                  }
              }

          '''
                  text = text.replace('    buildTypes {', signing + '    buildTypes {', 1)
                  if 'signingConfig signingConfigs.debug' in text:
                      text = text.replace(
                          'signingConfig signingConfigs.debug',
                          'signingConfig signingConfigs.sanadyarRelease',
                          1,
                      )
                  else:
                      text = text.replace(
                          '        release {',
                          '        release {\n            signingConfig signingConfigs.sanadyarRelease',
                          1,
                      )
                  groovy.write_text(text, encoding='utf-8')
          else:
              raise SystemExit('No Android app Gradle file found')
          PY

