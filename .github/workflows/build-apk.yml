      - name: Configure embedded or repository Bazikhone release keystore
        env:
          KEYSTORE_PACKAGE_NAME: bazikhone_release_keystore_package.zip
          SELECTED_SOURCE_ZIP: ${{ env.SELECTED_SOURCE_ZIP }}
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          project = Path(os.environ['PROJECT_DIR']).resolve()
          package_name = os.environ.get('KEYSTORE_PACKAGE_NAME', 'bazikhone_release_keystore_package.zip')
          signing_dir = root / '.ci' / 'signing'
          extract_dir = signing_dir / 'extracted'
          report_dir = root / '.ci' / 'reports'
          signing_dir.mkdir(parents=True, exist_ok=True)
          report_dir.mkdir(parents=True, exist_ok=True)
          shutil.rmtree(extract_dir, ignore_errors=True)
          extract_dir.mkdir(parents=True, exist_ok=True)

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()

          def safe_extract(archive: Path, destination: Path) -> None:
              destination.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f'Corrupt member {bad!r} in {archive.name}')
                  base = destination.resolve()
                  for member in zf.infolist():
                      target = (destination / member.filename).resolve()
                      if target != base and base not in target.parents:
                          raise RuntimeError(f'Unsafe ZIP member: {member.filename}')
                  zf.extractall(destination)

          search_bases = [project, root]
          direct: list[Path] = []
          for base in search_bases:
              for path in base.rglob(package_name):
                  if '.ci' in path.parts or not path.is_file():
                      continue
                  direct.append(path)
          direct = sorted(
              set(direct),
              key=lambda path: (
                  0 if project == path or project in path.parents else 1,
                  len(path.parts),
                  path.as_posix(),
              ),
          )
          package: Path | None = direct[0] if direct else None
          if package is not None:
              try:
                  origin = package.relative_to(root).as_posix()
              except ValueError:
                  origin = package.as_posix()
          else:
              origin = ''

          if package is None:
              selected = os.environ.get('SELECTED_SOURCE_ZIP', '').strip()
              outer_candidates: list[Path] = []
              if selected and selected != 'repository-root':
                  candidate = (root / selected).resolve()
                  if candidate.is_file() and candidate.suffix.lower() == '.zip':
                      outer_candidates.append(candidate)
              for candidate in root.glob('*.zip'):
                  if candidate not in outer_candidates:
                      outer_candidates.append(candidate)

              extracted_package = signing_dir / package_name
              for outer in outer_candidates:
                  try:
                      with zipfile.ZipFile(outer) as zf:
                          members = [
                              member for member in zf.infolist()
                              if Path(member.filename).name == package_name and not member.is_dir()
                          ]
                          if not members:
                              continue
                          member = sorted(members, key=lambda value: len(Path(value.filename).parts))[0]
                          extracted_package.write_bytes(zf.read(member))
                          package = extracted_package
                          origin = f'{outer.relative_to(root).as_posix()}::{member.filename}'
                          break
                  except zipfile.BadZipFile:
                      continue

          if package is None or not package.is_file():
              raise SystemExit(
                  f'Required release keystore package {package_name!r} was not found. '
                  'Upload it beside the source ZIP, embed it under tool/signing, or use the complete WF-42.1 package.'
              )

          safe_extract(package, extract_dir)
          jks_files = sorted(extract_dir.rglob('*.jks'))
          properties_files = sorted(extract_dir.rglob('key.properties'))
          if len(jks_files) != 1:
              raise SystemExit(f'Expected exactly one JKS file, found {len(jks_files)}')
          if len(properties_files) != 1:
              raise SystemExit(f'Expected exactly one key.properties, found {len(properties_files)}')

          props: dict[str, str] = {}
          for raw in properties_files[0].read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              props[key.strip()] = value.strip()

          required = ('storePassword', 'keyPassword', 'keyAlias')
          missing = [key for key in required if not props.get(key)]
          if missing:
              raise SystemExit(f'Incomplete key.properties; missing {missing}')

          target_jks = project / 'android' / 'app' / 'sanadyar-release-key.jks'
          target_props = project / 'android' / 'key.properties'
          target_jks.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(jks_files[0], target_jks)
          target_props.write_text(
              '\n'.join([
                  f"storePassword={props['storePassword']}",
                  f"keyPassword={props['keyPassword']}",
                  f"keyAlias={props['keyAlias']}",
                  'storeFile=sanadyar-release-key.jks',
                  '',
              ]),
              encoding='utf-8',
          )
          target_jks.chmod(0o600)
          target_props.chmod(0o600)

          verification = subprocess.run(
              [
                  'keytool', '-list', '-v',
                  '-keystore', str(target_jks),
                  '-storepass', props['storePassword'],
                  '-alias', props['keyAlias'],
              ],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              check=False,
          )
          if verification.returncode != 0:
              raise SystemExit('Keystore verification failed with keytool.')

          public_lines = []
          for line in verification.stdout.splitlines():
              stripped = line.strip()
              if stripped.startswith(('Alias name:', 'Creation date:', 'Entry type:', 'Valid from:', 'SHA1:', 'SHA256:', 'Signature algorithm name:', 'Subject Public Key Algorithm:')):
                  public_lines.append(stripped)

          report = [
              'Signing mode: packaged release keystore',
              f'Package origin: {origin}',
              f'Package SHA-256: {sha256(package)}',
              f'JKS SHA-256: {sha256(target_jks)}',
              f'Alias: {props["keyAlias"]}',
              *public_lines,
          ]
          (report_dir / 'signing.log').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY

          echo 'SIGNING_MODE=release' >> "$GITHUB_ENV"

      - name: Apply release signing configuration
        if: env.SIGNING_MODE == 'release'
        run: |
