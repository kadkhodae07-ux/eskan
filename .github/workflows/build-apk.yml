name: Sanadyar Build v1.0.16-build42 WF-42.1
run-name: Sanadyar v1.0.16+42 | WF-42.1 | APK + diagnostics

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: Optional Flutter source ZIP path. Leave empty for automatic selection.
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: sanadyar-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WORKFLOW_VERSION: WF-42.1-adivery-r8-dual-store-release
  FLUTTER_VERSION: 3.44.6
  JAVA_VERSION: '21'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_TARGET_SDK: '36'
  ANDROID_MIN_SDK: '24'
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_GRADLE_PLUGIN: 8.11.1
  GRADLE_VERSION: 8.14.3
  KOTLIN_VERSION: 2.2.20
  APP_PACKAGE: mk.kadkhodai.sanadyar
  APP_VERSION_NAME: 1.0.16
  APP_VERSION_CODE: '42'
  FILE_PICKER_VERSION: 10.3.10
  GAL_VERSION: 2.3.3
  SELFIE_SEGMENTATION_VERSION: 0.11.0
  FACE_DETECTION_VERSION: 0.14.0
  ADIVERY_VERSION: 4.9.0
  FLUTTER_POOLAKEY_VERSION: 2.2.0+1.0.0
  MYKET_IAP_VERSION: 1.1.12
  TESSERACT_OCR_VERSION: 0.5.0+sanadyar.1
  TESSERACT_OCR_PATH: packages/tesseract_ocr
  TESSERACT_ENGINE_VERSION: 4.8.0
  SOURCE_ZIP_INPUT: ${{ github.event.inputs.source_zip || '' }}
  SANADYAR_API_BASE_URL: ${{ vars.SANADYAR_API_BASE_URL }}
  SANADYAR_PRO_PRODUCT_ID: ${{ vars.SANADYAR_PRO_PRODUCT_ID }}
  SANADYAR_BAZAAR_RSA_KEY: ${{ secrets.SANADYAR_BAZAAR_RSA_KEY }}
  SANADYAR_MYKET_RSA_KEY: ${{ secrets.SANADYAR_MYKET_RSA_KEY }}

jobs:
  build-apk:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize clean workspace
        run: |
          set -Eeuo pipefail
          rm -rf "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/dist"
          mkdir -p \
            "$GITHUB_WORKSPACE/.ci/extracted" \
            "$GITHUB_WORKSPACE/.ci/reports" \
            "$GITHUB_WORKSPACE/dist/apk" \
            "$GITHUB_WORKSPACE/dist/logs"

          {
            echo "WORKFLOW_VERSION=$WORKFLOW_VERSION"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "COMMIT=$GITHUB_SHA"
          } | tee "$GITHUB_WORKSPACE/.ci/reports/workflow-info.log"

          cat > "$GITHUB_WORKSPACE/.ci/sanadyar-bash-env.sh" <<'EOF'
          sanadyar_failure_context() {
            local rc=$?
            local failed_command="${BASH_COMMAND:-unknown}"
            trap - ERR
            mkdir -p "${GITHUB_WORKSPACE}/.ci/reports"
            {
              echo "exit_code=${rc}"
              echo "action=${GITHUB_ACTION:-unknown}"
              echo "command=${failed_command}"
              echo "line=${BASH_LINENO[0]:-unknown}"
              echo "source=${BASH_SOURCE[1]:-unknown}"
              date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
            } > "${GITHUB_WORKSPACE}/.ci/reports/failure-context.log"
            exit "${rc}"
          }
          trap sanadyar_failure_context ERR
          EOF
          echo "BASH_ENV=$GITHUB_WORKSPACE/.ci/sanadyar-bash-env.sh" >> "$GITHUB_ENV"

      - name: Select exact Build 42 Flutter source
        id: source
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import re
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          ci_dir = root / '.ci'
          work_dir = ci_dir / 'source-selection'
          final_extract = ci_dir / 'extracted'
          report_path = ci_dir / 'reports' / 'source-selection.log'
          expected = f"{os.environ['APP_VERSION_NAME']}+{os.environ['APP_VERSION_CODE']}"
          requested_input = os.environ.get('SOURCE_ZIP_INPUT', '').strip()

          shutil.rmtree(work_dir, ignore_errors=True)
          shutil.rmtree(final_extract, ignore_errors=True)
          work_dir.mkdir(parents=True, exist_ok=True)
          final_extract.mkdir(parents=True, exist_ok=True)
          report_path.parent.mkdir(parents=True, exist_ok=True)

          excluded_tokens = (
              'apk', 'logs', 'diagnostic', 'artifact', 'output',
              'failure', 'sha256', 'checksum',
          )
          version_pattern = re.compile(r'(?m)^version:\s*([^\s#]+)')
          build_pattern = re.compile(r'(?:build|\+|_)(\d+)', re.IGNORECASE)
          discovered: list[str] = []

          def safe_extract(archive: Path, destination: Path) -> None:
              destination.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f'Corrupt member {bad!r} in {archive.name}')
                  root_prefix = destination.resolve()
                  for member in zf.infolist():
                      target = (destination / member.filename).resolve()
                      if target != root_prefix and root_prefix not in target.parents:
                          raise RuntimeError(f'Unsafe ZIP path in {archive.name}: {member.filename}')
                  zf.extractall(destination)
                  for member in zf.infolist():
                      target = destination / member.filename
                      unix_mode = (member.external_attr >> 16) & 0o777
                      if unix_mode and target.exists():
                          target.chmod(unix_mode)

          def project_version(project: Path) -> str | None:
              pubspec = project / 'pubspec.yaml'
              main = project / 'lib' / 'main.dart'
              if not pubspec.is_file() or not main.is_file():
                  return None
              match = version_pattern.search(pubspec.read_text(encoding='utf-8'))
              return match.group(1).strip() if match else None

          def flutter_projects(base: Path) -> list[Path]:
              projects: list[Path] = []
              for pubspec in base.rglob('pubspec.yaml'):
                  parts = set(pubspec.parts)
                  if '.dart_tool' in parts or 'build' in parts:
                      continue
                  project = pubspec.parent
                  if (project / 'lib' / 'main.dart').is_file():
                      projects.append(project)
              return sorted(
                  set(projects),
                  key=lambda item: (len(item.relative_to(base).parts), item.as_posix()),
              )

          def candidate_score(path: Path) -> tuple[int, int, int, str]:
              lower = path.name.lower()
              numbers = [int(value) for value in build_pattern.findall(lower)]
              build = max(numbers, default=0)
              exact_name = int(build == int(os.environ['APP_VERSION_CODE']))
              source_hint = int('source' in lower or 'flutter' in lower)
              complete_hint = int('complete' in lower)
              # Exact build first, then direct source, then complete pack, then newest mtime.
              return (exact_name, source_hint * 2 + complete_hint, path.stat().st_mtime_ns, path.name)

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()

          def inspect_archive(outer_zip: Path, index: int) -> tuple[Path, str] | None:
              outer_dir = work_dir / f'outer-{index:03d}'
              try:
                  safe_extract(outer_zip, outer_dir)
              except Exception as exc:
                  discovered.append(f'REJECT {outer_zip.name}: invalid ZIP ({exc})')
                  return None

              # First accept a direct Flutter source archive only when its real pubspec is exact.
              for project in flutter_projects(outer_dir):
                  version = project_version(project)
                  discovered.append(f'FOUND {outer_zip.name} -> {project.relative_to(outer_dir)} version={version or "missing"}')
                  if version == expected:
                      return project, ''

              # Complete packs may contain the actual source as a nested ZIP.
              nested_archives = sorted(
                  outer_dir.rglob('*.zip'),
                  key=candidate_score,
                  reverse=True,
              )
              for nested_index, nested_zip in enumerate(nested_archives):
                  nested_dir = work_dir / f'outer-{index:03d}-nested-{nested_index:03d}'
                  try:
                      safe_extract(nested_zip, nested_dir)
                  except Exception as exc:
                      discovered.append(f'REJECT nested {nested_zip.name}: invalid ZIP ({exc})')
                      continue
                  for project in flutter_projects(nested_dir):
                      version = project_version(project)
                      discovered.append(
                          f'FOUND {outer_zip.name} -> {nested_zip.name} -> '
                          f'{project.relative_to(nested_dir)} version={version or "missing"}'
                      )
                      if version == expected:
                          return project, nested_zip.relative_to(outer_dir).as_posix()

              discovered.append(f'REJECT {outer_zip.name}: no Flutter source with exact version {expected}')
              return None

          if requested_input:
              requested = (root / requested_input).resolve()
              if root != requested and root not in requested.parents:
                  raise SystemExit(f'Requested source path escapes repository: {requested_input}')
              if not requested.is_file():
                  raise SystemExit(f'Requested ZIP does not exist: {requested_input}')
              candidates = [requested]
          else:
              candidates = [
                  path for path in root.glob('*.zip')
                  if not any(token in path.name.lower() for token in excluded_tokens)
              ]
              candidates.sort(key=candidate_score, reverse=True)

          selected_outer: Path | None = None
          selected_inner = ''
          selected_project: Path | None = None

          for index, candidate in enumerate(candidates):
              inspected = inspect_archive(candidate, index)
              if inspected is None:
                  continue
              selected_project, selected_inner = inspected
              selected_outer = candidate
              break

          # A directly committed project is accepted only if no source ZIP was requested
          # and its real version already matches the expected Build 42 version.
          if selected_project is None and not requested_input:
              root_version = project_version(root)
              if root_version is not None:
                  discovered.append(f'FOUND repository root version={root_version}')
              if root_version == expected:
                  selected_project = root

          if selected_project is None:
              report_path.write_text('\n'.join(discovered) + '\n', encoding='utf-8')
              print('\n'.join(discovered), file=sys.stderr)
              raise SystemExit(
                  f'No exact Sanadyar source {expected} was found. '
                  'Older source archives are never promoted by rewriting pubspec.yaml.'
              )

          destination = final_extract / 'sanadyar'
          if selected_project.resolve() == root:
              # Keep repository-root mode without recursively copying .git/.ci/build outputs.
              project_dir = root
              origin = 'repository-root'
              source_digest = 'repository-root'
          else:
              shutil.copytree(
                  selected_project,
                  destination,
                  ignore=shutil.ignore_patterns('.dart_tool', 'build', '.gradle', '.git'),
              )
              project_dir = destination
              origin = selected_outer.relative_to(root).as_posix() if selected_outer else 'unknown'
              source_digest = sha256(selected_outer) if selected_outer else 'unknown'

          final_version = project_version(project_dir)
          if final_version != expected:
              raise SystemExit(
                  f'Extracted source version mismatch: expected {expected}, found {final_version}'
              )

          report_lines = [
              f'Expected version: {expected}',
              f'Selected outer ZIP: {origin}',
              f'Selected nested ZIP: {selected_inner or "direct source"}',
              f'Source SHA-256: {source_digest}',
              f'Project directory: {project_dir}',
              f'Verified pubspec version: {final_version}',
              '',
              'Inspection log:',
              *discovered,
          ]
          report_path.write_text('\n'.join(report_lines) + '\n', encoding='utf-8')
          print('\n'.join(report_lines))

          env_file = Path(os.environ['GITHUB_ENV'])
          output_file = Path(os.environ['GITHUB_OUTPUT'])
          with env_file.open('a', encoding='utf-8') as handle:
              handle.write(f'PROJECT_DIR={project_dir}\n')
              handle.write(f'SELECTED_SOURCE_ZIP={origin}\n')
              handle.write(f'SELECTED_INNER_ZIP={selected_inner}\n')
              handle.write(f'SELECTED_SOURCE_SHA256={source_digest}\n')
          with output_file.open('a', encoding='utf-8') as handle:
              handle.write(f'project_dir={project_dir}\n')
              handle.write(f'selected_zip={origin}\n')
              handle.write(f'selected_inner_zip={selected_inner}\n')
              handle.write(f'source_sha256={source_digest}\n')
          PY

      - name: Normalize extracted helper permissions
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          test -f tool/enforce_android_jvm17.py
          test -f tool/verify_vendored_ocr.py
          test -f tool/configure_android_storage.py
          chmod 755 tool/enforce_android_jvm17.py tool/verify_vendored_ocr.py tool/configure_android_storage.py
          stat -c '%a %n' tool/enforce_android_jvm17.py tool/verify_vendored_ocr.py tool/configure_android_storage.py \
            | tee "$GITHUB_WORKSPACE/.ci/reports/helper-permissions.log"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Record tool versions
        run: |
          set -Eeuo pipefail
          flutter --version | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-version.log"
          dart --version 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/dart-version.log"
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/java-version.log"
          flutter doctor -v 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-doctor.log"

      - name: Install Android SDK 36
        run: |
          set -Eeuo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo 'ANDROID_SDK_ROOT and ANDROID_HOME are empty.' >&2
            exit 1
          fi

          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "sdkmanager was not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi

          set +e
          set +o pipefail
          yes | "$sdkmanager" --licenses > "$GITHUB_WORKSPACE/.ci/reports/android-licenses.log" 2>&1
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          set -e

          if [ "$license_status" -ne 0 ]; then
            tail -n 100 "$GITHUB_WORKSPACE/.ci/reports/android-licenses.log" >&2 || true
            exit "$license_status"
          fi

          "$sdkmanager" \
            'platform-tools' \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/android-sdk-install.log"

          test -d "$sdk_root/platforms/android-$ANDROID_COMPILE_SDK"
          test -d "$sdk_root/build-tools/$ANDROID_BUILD_TOOLS"

      - name: Ensure Android project exists
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ] \
            || { [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; }; then
            flutter create \
              --platforms=android \
              --org mk.kadkhodai \
              --project-name sanadyar \
              . 2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-create-android.log"
          else
            echo 'Existing Android project preserved; generated state will be cleaned separately.' \
              | tee "$GITHUB_WORKSPACE/.ci/reports/flutter-create-android.log"
          fi

          test -f android/gradlew
          chmod +x android/gradlew

      - name: Normalize Android Gradle, Kotlin and app configuration
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          agp = os.environ['ANDROID_GRADLE_PLUGIN']
          gradle_version = os.environ['GRADLE_VERSION']
          kotlin = os.environ['KOTLIN_VERSION']
          package = os.environ['APP_PACKAGE']
          compile_sdk = os.environ['ANDROID_COMPILE_SDK']
          target_sdk = os.environ['ANDROID_TARGET_SDK']
          min_sdk = os.environ['ANDROID_MIN_SDK']

          settings = next(
              (p for p in (Path('android/settings.gradle.kts'), Path('android/settings.gradle')) if p.exists()),
              None,
          )
          if settings is None:
              raise SystemExit('Android settings.gradle(.kts) was not generated')

          text = settings.read_text(encoding='utf-8')
          if settings.suffix == '.kts':
              text, agp_count = re.subn(
                  r'id\("com\.android\.application"\)\s+version\s+"[^"]+"\s+apply\s+false',
                  f'id("com.android.application") version "{agp}" apply false',
                  text,
                  count=1,
              )
              text, kotlin_count = re.subn(
                  r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
                  f'id("org.jetbrains.kotlin.android") version "{kotlin}" apply false',
                  text,
                  count=1,
              )
              if kotlin_count == 0:
                  marker = f'id("com.android.application") version "{agp}" apply false'
                  text = text.replace(
                      marker,
                      marker + f'\n    id("org.jetbrains.kotlin.android") version "{kotlin}" apply false',
                      1,
                  )
              if agp_count != 1:
                  raise SystemExit('Unable to pin Android Gradle Plugin in settings.gradle.kts')
          else:
              text, agp_count = re.subn(
                  r"id ['\"]com\.android\.application['\"] version ['\"][^'\"]+['\"] apply false",
                  f'id "com.android.application" version "{agp}" apply false',
                  text,
                  count=1,
              )
              text, kotlin_count = re.subn(
                  r"id ['\"]org\.jetbrains\.kotlin\.android['\"] version ['\"][^'\"]+['\"] apply false",
                  f'id "org.jetbrains.kotlin.android" version "{kotlin}" apply false',
                  text,
                  count=1,
              )
              if kotlin_count == 0:
                  marker = f'id "com.android.application" version "{agp}" apply false'
                  text = text.replace(
                      marker,
                      marker + f'\n    id "org.jetbrains.kotlin.android" version "{kotlin}" apply false',
                      1,
                  )
              if agp_count != 1:
                  raise SystemExit('Unable to pin Android Gradle Plugin in settings.gradle')
          settings.write_text(text, encoding='utf-8')

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper_text = wrapper.read_text(encoding='utf-8')
          wrapper_text, wrapper_count = re.subn(
              r'distributionUrl=.*gradle-[^-\s]+-(?:all|bin)\.zip',
              f'distributionUrl=https\\://services.gradle.org/distributions/gradle-{gradle_version}-all.zip',
              wrapper_text,
              count=1,
          )
          if wrapper_count != 1:
              raise SystemExit('Unable to pin Gradle wrapper version')
          wrapper.write_text(wrapper_text, encoding='utf-8')

          app_gradle = next(
              (p for p in (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')) if p.exists()),
              None,
          )
          if app_gradle is None:
              raise SystemExit('Android app Gradle file was not generated')

          app = app_gradle.read_text(encoding='utf-8')
          if app_gradle.suffix == '.kts':
              if 'id("org.jetbrains.kotlin.android")' not in app:
                  app = app.replace(
                      'id("com.android.application")',
                      'id("com.android.application")\n    id("org.jetbrains.kotlin.android")',
                      1,
                  )
              app = re.sub(r'namespace\s*=\s*"[^"]+"', f'namespace = "{package}"', app)
              app = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package}"', app)
              app, c1 = re.subn(r'(?m)^(\s*)compileSdk\s*=\s*[^\n]+$', rf'\1compileSdk = {compile_sdk}', app, count=1)
              app, c2 = re.subn(r'(?m)^(\s*)minSdk\s*=\s*[^\n]+$', rf'\1minSdk = {min_sdk}', app, count=1)
              app, c3 = re.subn(r'(?m)^(\s*)targetSdk\s*=\s*[^\n]+$', rf'\1targetSdk = {target_sdk}', app, count=1)
          else:
              if "id 'org.jetbrains.kotlin.android'" not in app and 'id "org.jetbrains.kotlin.android"' not in app:
                  app = app.replace(
                      "id 'com.android.application'",
                      "id 'com.android.application'\n    id 'org.jetbrains.kotlin.android'",
                      1,
                  )
              app = re.sub(r'namespace\s+["\'][^"\']+["\']', f'namespace "{package}"', app)
              app = re.sub(r'applicationId\s+["\'][^"\']+["\']', f'applicationId "{package}"', app)
              app, c1 = re.subn(r'(?m)^(\s*)compileSdk(?:Version)?\s+[^\n]+$', rf'\1compileSdkVersion {compile_sdk}', app, count=1)
              app, c2 = re.subn(r'(?m)^(\s*)minSdk(?:Version)?\s+[^\n]+$', rf'\1minSdkVersion {min_sdk}', app, count=1)
              app, c3 = re.subn(r'(?m)^(\s*)targetSdk(?:Version)?\s+[^\n]+$', rf'\1targetSdkVersion {target_sdk}', app, count=1)

          if (c1, c2, c3) != (1, 1, 1):
              raise SystemExit(f'Unable to normalize SDK levels: compile={c1}, min={c2}, target={c3}')
          app_gradle.write_text(app, encoding='utf-8')

          gradle_properties = Path('android/gradle.properties')
          props = gradle_properties.read_text(encoding='utf-8') if gradle_properties.exists() else ''
          required = {
              'org.gradle.jvmargs': '-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError',
              'android.useAndroidX': 'true',
              'android.enableJetifier': 'true',
              'kotlin.jvm.target.validation.mode': 'error',
              'org.gradle.java.installations.auto-detect': 'true',
              'org.gradle.java.installations.auto-download': 'false',
          }
          lines = [line for line in props.splitlines() if line.strip()]
          existing = {line.split('=', 1)[0].strip() for line in lines if '=' in line}
          for key, value in required.items():
              if key not in existing:
                  lines.append(f'{key}={value}')
          gradle_properties.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # local_auth requires a FragmentActivity on Android.
          java_root = Path('android/app/src/main/java')
          kotlin_root = Path('android/app/src/main/kotlin')
          for generated in list(java_root.rglob('MainActivity.java')) + list(kotlin_root.rglob('MainActivity.kt')):
              generated.unlink()

          main_activity = kotlin_root / Path(package.replace('.', '/')) / 'MainActivity.kt'
          main_activity.parent.mkdir(parents=True, exist_ok=True)
          main_activity.write_text(
              f'''package {package}\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity : FlutterFragmentActivity()\n''',
              encoding='utf-8',
          )

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text(encoding='utf-8')
          manifest_text = re.sub(r'\s+package="[^"]+"', '', manifest_text)
          permission_lines = [
              ('android.permission.INTERNET', '<uses-permission android:name="android.permission.INTERNET" />'),
              ('android.permission.CAMERA', '<uses-permission android:name="android.permission.CAMERA" />'),
              ('android.permission.USE_BIOMETRIC', '<uses-permission android:name="android.permission.USE_BIOMETRIC" />'),
